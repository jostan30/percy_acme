<body class="page-contact">

    <h1>Contact us</h1>
    <p>We usually reply within one business day.</p>
    <form>
      <label for="name">Name</label><input id="name" type="text" placeholder="Your name">
      <label for="email">Email</label><input id="email" type="email" placeholder="you@example.com">
      <label for="msg">Message</label><textarea id="msg" rows="5" placeholder="How can we help?"></textarea>
      <button class="btn" type="button">Send message</button>
    </form>
  </main>
